version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: hd_downloader_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: hd_downloader_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hd_downloader_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/hd_downloader
      - REDIS_URL=redis://redis:6379
      - TEMP_DOWNLOAD_DIR=/tmp/media
      - MAX_FILE_SIZE_MB=500
      - MAX_DOWNLOAD_TIME_SECONDS=300
      - MAX_CONCURRENT_JOBS=5
      - RATE_LIMIT_PER_MINUTE=30
      - TEMP_FILE_TTL_SECONDS=3600
    depends_on:
      - mongodb
      - redis
    volumes:
      - media_data:/tmp/media

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hd_downloader_worker
    restart: always
    command: ["node", "dist/workers/downloadWorker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/hd_downloader
      - REDIS_URL=redis://redis:6379
      - TEMP_DOWNLOAD_DIR=/tmp/media
      - MAX_FILE_SIZE_MB=500
      - MAX_DOWNLOAD_TIME_SECONDS=300
      - MAX_CONCURRENT_JOBS=5
    depends_on:
      - mongodb
      - redis
    volumes:
      - media_data:/tmp/media

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hd_downloader_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
  media_data:
